[workspace]
members = ["crates/core", "crates/cli", "apps/desktop/src-tauri"]
default-members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
